android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official
# AGP 8.1.0 fails its androidJdkImage/jlink step on JDK 22 (the only system JDK on this
# machine) — point Gradle at Android Studio's bundled JDK 17 instead. This path is specific
# to this machine; if the project moves elsewhere, replace it or remove the line to fall
# back to JAVA_HOME/the system JDK.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
